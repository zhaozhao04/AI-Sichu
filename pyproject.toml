[project]
name = "sichu"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "'Baizhaoyan'", email = "zhaoy02@126.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alibabacloud-oss-v2>=1.4.0",
    "dotenv>=0.9.9",
    "fastapi>=0.141.1",
    "langchain>=1.3.18",
    "langchain-openai>=1.6.0",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.1.1",
]

[project.scripts]
sichu = "sichu:main"

# 仅本地开发使用，Vercel 构建时不会安装
[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.31",
    "pytest>=9.1.1",
    "streamlit>=1.63.0",
    "uvicorn>=0.30.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
